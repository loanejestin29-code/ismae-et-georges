<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Aperçu des personnages</title>
<style>
  body { margin: 0; background: #1b1626; color: #e9dcc6; font: 14px/1.4 system-ui, sans-serif; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { margin: 0 0 12px; color: #b9a98f; }
  canvas { image-rendering: pixelated; display: block; max-width: 100%; }
</style>
</head>
<body>
<h1>Aperçu des personnages</h1>
<p>Modifie <code>js/config.js</code> puis recharge cette page pour voir le résultat.</p>
<canvas id="c"></canvas>
<script src="js/pixel.js"></script>
<script src="js/config.js"></script>
<script src="js/sprite-ismae.js"></script>
<script src="js/characters.js"></script>
<script src="js/decor-objets.js"></script>
<script>
  const S = 4, W = 200, H = 150;
  const c = document.getElementById('c');
  c.width = W * S; c.height = H * S;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.scale(S, S);
  g.fillStyle = '#8f8676'; g.fillRect(0, 0, W, H);
  const ligne = (imgs, y, pas) => { let x = 2; imgs.forEach((im) => { g.drawImage(im, x, y); x += pas || im.width + 2; }); };
  const ismae = Sprites.person(CONFIG.ismae);
  ligne([ismae.down.idle, ismae.up.idle, ismae.left.idle, ismae.right.idle, ...ismae.down.walk, ...ismae.right.walk], 2, 19);
  const georges = Sprites.cat('georges'), poses = Sprites.georgesPoses();
  ligne([georges.sit[0], georges.walkR[0], poses.dosRondR, poses.herisseR, poses.chuteR], 34);
  const duchesse = Sprites.cat('duchesse');
  const k = ['marie', 'toulouse', 'berlioz'].map(Sprites.chaton);
  ligne([duchesse.sit[0], duchesse.walkR[0], duchesse.sitR[0], ...k.map((s) => s.sit[0]), ...k.map((s) => s.walkR[0]), k[1].dosRondR[0], k[1].dosRondR[1], k[2].rire[0]], 54);
  const m = Object.keys(Sprites.MUSICIENS).map((t) => Sprites.musicien(t));
  ligne(m.map((f) => f[0]).concat(m.map((f) => f[1])), 76, 33);
  const pnj = [
    { peau: '#f0c4a0', cheveux: '#8a5a3a', coiffure: 'chignon', barbe: 'aucune', yeux: '#3a2a2e', veste: '#a8484a', tablier: '#f4efe6', coupe: 'robe', pantalon: '#7a3a3a', chaussures: '#3a2a2a' },
    { peau: '#d8a07a', cheveux: '#2a2020', coiffure: 'court', barbe: 'aucune', yeux: '#2a1d2e', chapeau: 'casquette', couleurChapeau: '#4a5a7a', ruban: '#2a3a5a', veste: '#5a7a5a', echarpe: '#e8c84a', pantalon: '#4a4a5a', chaussures: '#3a2a22' },
    { peau: '#f2cdb0', cheveux: '#c8823a', coiffure: 'chignon', barbe: 'aucune', yeux: '#3a5a8a', chapeau: 'capeline', couleurChapeau: '#6a4a8a', ruban: '#e8b54a', fleur: '#ff9ac0', veste: '#4a5aa0', echarpe: '#f0e0d0', coupe: 'robe', pantalon: '#3a3a6a', chaussures: '#2a2026' },
    { peau: '#e8c0a0', cheveux: '#dcd8e2', coiffure: 'court', barbe: 'pleine', couleurBarbe: '#ecebf0', lunettes: true, yeux: '#2a1d2e', chapeau: 'melon', couleurChapeau: '#2a2630', ruban: '#4a3a3a', veste: '#5e4a3a', echarpe: '#8a2a3a', pantalon: '#3a3440', chaussures: '#2a2026' },
    { peau: '#e0b08a', cheveux: '#3a2a24', coiffure: 'boucles', barbe: 'courte', yeux: '#2a1d2e', chapeau: 'beret', couleurChapeau: '#2a2a3a', veste: '#e8e0d0', echarpe: '#c9483b', pantalon: '#4a5a7a', chaussures: '#3a2a22' },
  ].map(Sprites.person);
  ligne(pnj.map((p) => p.down.idle).concat(pnj.map((p) => p.right.walk[0])), 112, 19);
</script>
</body>
</html>
