<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aperçu des personnages</title>
<style>
  body { margin: 0; background: #1b1626; color: #e9dcc6; font: 14px/1.4 system-ui, sans-serif; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { margin: 0 0 12px; color: #b9a98f; }
  canvas { image-rendering: pixelated; display: block; max-width: 100%; }
</style>
</head>
<body>
<h1>Aperçu des personnages</h1>
<p>Modifie <code>js/config.js</code> puis recharge cette page pour voir le résultat.</p>
<canvas id="c"></canvas>
<script src="js/pixel.js"></script>
<script src="js/config.js"></script>
<script src="js/characters.js"></script>
<script src="js/decor-batiments.js"></script>
<script>
  const S = 5;
  const ismae = Sprites.person(CONFIG.ismae);
  const georges = Sprites.cat('georges');
  const autres = ['blanc', 'roux', 'gris', 'tigre', 'siamois'].map(Sprites.cat);
  const pig = Sprites.pigeon();
  const c = document.getElementById('c');
  c.width = 160 * S; c.height = 150 * S;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.scale(S, S);
  g.fillStyle = '#8f8676'; g.fillRect(0, 0, 160, 150);
  let x = 2;
  for (const d of ['down', 'up', 'left', 'right']) {
    g.drawImage(ismae[d].idle, x, 2);
    ismae[d].walk.forEach((f, i) => g.drawImage(f, x, 32 + i * 0));
    x += 20;
  }
  x = 2;
  ismae.down.walk.concat(ismae.right.walk).forEach((f) => { g.drawImage(f, x, 32); x += 19; });
  x = 2;
  georges.walkR.concat(georges.down, georges.up).forEach((f) => { g.drawImage(f, x, 64); x += f.width + 2; });
  x = 2;
  georges.sit.concat(georges.sitR, georges.sleep).forEach((f) => { g.drawImage(f, x, 82); x += f.width + 2; });
  x = 2;
  autres.forEach((a) => { g.drawImage(a.sit[0], x, 102); g.drawImage(a.walkR[0], x, 120); x += 24; });
  x = 126;
  ['stand', 'peck', 'fly1', 'fly2'].forEach((k, i) => g.drawImage(pig[k], x + (i % 2) * 12, 102 + Math.floor(i / 2) * 12));

  // ---- quelques immeubles
  if (typeof Batiments !== 'undefined') {
    const specs = [
      { w: 110, facade: 'creme', boutique: 'fromagerie', seed: 3 },
      { w: 150, facade: 'ocre', boutique: 'cafe', seed: 5 },
      { w: 120, facade: 'rose', boutique: 'fleuriste', seed: 9, lierre: 'droite' },
      { w: 180, facade: 'gris', boutique: 'carrefour', seed: 11 },
      { w: 130, facade: 'ocre', boutique: 'librairie', style: 'ancien', etages: 4, volets: '#4c6f96', seed: 13 },
      { w: 140, facade: 'creme', boutique: 'hotel', seed: 17 },
    ];
    const bs = specs.map(Batiments.building);
    const B = 3;
    const c2 = document.createElement('canvas');
    const tw = bs.reduce((a, b) => a + b.w, 0);
    c2.width = tw * B; c2.height = 220 * B;
    document.body.appendChild(c2);
    const g2 = c2.getContext('2d');
    g2.imageSmoothingEnabled = false;
    g2.scale(B, B);
    g2.fillStyle = '#6b6878'; g2.fillRect(0, 0, tw, 220);
    let bx = 0;
    bs.forEach((b) => { g2.drawImage(b.img, bx, 215 - b.h); bx += b.w; });
    g2.fillStyle = '#ffffff'; g2.fillRect(0, 0, 200, 40);
    g2.drawImage(Batiments.carrefourLogo('petit'), 4, 4);
    g2.drawImage(Batiments.carrefourLogo('grand'), 26, 4);
    g2.drawImage(Batiments.carrefourLogo('grand', 2), 54, 4);
  }
</script>
</body>
</html>
